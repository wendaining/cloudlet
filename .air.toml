root = "."
tmp_dir = ".local/default/air"
env_files = []

[build]
cmd = "go build -o .local/default/server ./cmd/server"
entrypoint = [".local/default/server"]
include_ext = ["go"]
include_file = ["go.mod", "go.sum"]
exclude_dir = [".git", ".local", "bin", "dist", "node_modules", "web"]
exclude_regex = ["_test\\.go"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "10s"

[log]
time = true

[misc]
clean_on_exit = false
startup_banner = ""

[screen]
clear_on_rebuild = false
