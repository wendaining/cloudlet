  /api/v1/projects/{projectID}/worker-deployments/{deploymentID}/activate:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
      - name: deploymentID
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: activateWorkerDeployment
      description: 由项目所有者或开发者显式激活已就绪的候选版本。同一版本的重复激活返回原操作，域名保持不变。
      security:
        - SessionCookie: []
      responses:
        "200":
          description: 激活已完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    BrowserProjectID:
      name: projectID
      in: path
      required: true
      schema:
        type: string
    BrowserSessionID:
      name: sessionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StaticSitePageLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    StaticSitePageCursor:
      name: cursor
      in: query
      description: 同一个列表接口上一页返回的 next_cursor。首次查询时省略。
      schema:
        type: string
        minLength: 1
        maxLength: 63
    SiteProjectID:
      name: projectID
      in: path
      required: true
      schema:
        type: string
    SiteName:
      name: siteName
      in: path
      required: true
      schema:
        type: string
        maxLength: 63
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: cloudlet_default_session
      description: 会话 Cookie 名称为 cloudlet_实例名称_session，默认实例名称为 default。
  schemas:
    User:
      type: object
      required: [ id, email ]
      properties:
        id:
          type: string
        email:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [ email, password ]
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          maxLength: 72
    VersionInfo:
      type: object
      required: [ version, commit ]
      properties:
        version:
          type: string
        commit:
          type: string
    Environment:
      type: object
      required: [ instance, database_version ]
      properties:
        instance:
          type: string
        database_version:
          type: integer
          format: int64
    ClickBrowserPageRequest:
      type: object
      additionalProperties: false
      required: [ selector ]
      properties:
        selector:
          type: string
          minLength: 1
          maxLength: 1024
          description: 唯一定位当前页面元素的 CSS 选择器
        timeout_ms:
          type: integer
          minimum: 1
          maximum: 30000
          default: 10000
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [ name ]
      properties:
        name:
          type: string
          description: 服务端去除首尾空白后必须包含 1 至 100 个 Unicode 字符；原始字符串可以包含首尾空白。
    RenameProjectRequest:
      type: object
      additionalProperties: false
      required: [ name ]
      properties:
        name:
          type: string
          description: 服务端去除首尾空白后必须包含 1 至 100 个 Unicode 字符；原始字符串可以包含首尾空白。
    Project:
      type: object
      required: [ id, name ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    ProjectRole:
      type: string
      enum: [ owner, developer, viewer ]
    ResourceAmounts:
      type: object
      required: [ cpu_millis, memory_bytes, instances ]
      properties:
        cpu_millis:
          type: integer
          format: int64
          minimum: 0
          description: CPU 毫核。
        memory_bytes:
          type: integer
          format: int64
          minimum: 0
          description: 内存字节。
        instances:
          type: integer
          format: int64
          minimum: 0
          description: 实例数。
    ProjectCapacity:
      type: object
      description: 项目配额与活动预留快照。used 可能超过 limit；remaining 是按资源钳制后的额度内余量，不表示超用标记。
      required: [ project_id, limit, used, remaining ]
      properties:
        project_id:
          type: string
          format: uuid
        limit:
          $ref: '#/components/schemas/ResourceAmounts'
        used:
          $ref: '#/components/schemas/ResourceAmounts'
        remaining:
          $ref: '#/components/schemas/ResourceAmounts'
    UpdateProjectCapacityRequest:
      type: object
      description: 调整后的项目额度。三个字段都必须提供，单位为 CPU 毫核、内存字节与实例数，非法或非正的单位返回 400。
      required: [ cpu_millis, memory_bytes, instances ]
      properties:
        cpu_millis:
          type: integer
          format: int64
          minimum: 1
          description: CPU 毫核，必须为正整数。
        memory_bytes:
          type: integer
          format: int64
          minimum: 1
          description: 内存字节，必须为正整数。
        instances:
          type: integer
          format: int64
          minimum: 1
          description: 实例数，必须为正整数。
    ProjectMemberRole:
      type: string
      enum: [ developer, viewer ]
    ProjectMember:
      type: object
      required: [ user_id, email, role ]
      properties:
        user_id:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/ProjectRole'
    ProjectSecret:
      type: object
      required: [ id, name, latest_version, created_at, updated_at ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        latest_version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectSecretVersion:
      type: object
      required: [ id, secret_id, name, version, created_at ]
      properties:
        id:
          type: string
          format: uuid
        secret_id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
    ProjectSecretValue:
      type: object
      required: [ id, secret_id, name, version, created_at, value ]
      properties:
        id:
          type: string
          format: uuid
        secret_id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        value:
          type: string
    CreateProjectSecretRequest:
      type: object
      additionalProperties: false
      required: [ name, value ]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'
        value:
          type: string
          minLength: 1
          description: UTF-8 编码后包含 1 至 65536 字节。
    UpsertProjectMemberRequest:
      type: object
      additionalProperties: false
      required: [ email, role ]
      properties:
        email:
          type: string
          description: 已有账号的邮箱；服务端去除首尾空白并转为小写后查找。
          minLength: 1
          maxLength: 254
        role:
          $ref: '#/components/schemas/ProjectMemberRole'
    Session:
      type: object
      required: [ user, projects ]
      properties:
        user:
          $ref: "#/components/schemas/User"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    BrowserConsoleEntry:
      type: object
      required: [ kind, level, message, truncated ]
      properties:
        kind:
          type: string
          description: console 表示控制台消息，page_error 表示未捕获的页面错误
        level:
          type: string
        message:
          type: string
          maxLength: 512
        truncated:
          type: boolean
    BrowserConsole:
      type: object
      required: [ entries, dropped ]
      properties:
        entries:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/BrowserConsoleEntry'
        dropped:
          type: integer
          format: int64
          minimum: 0
          description: 已从会话历史移除的旧记录数
    BrowserScreenshot:
      type: object
      required: [ id, artifact_digest, size_bytes, download_url, created_at ]
      properties:
        id:
          type: string
          format: uuid
        artifact_digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: 原始 PNG 的 SHA-256 摘要
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 2097152
        download_url:
          type: string
          description: 需要项目会话凭据的相对下载地址
        created_at:
          type: string
          format: date-time
    CaptureBrowserDownloadRequest:
      type: object
      required: [ selector ]
      additionalProperties: false
      properties:
        selector:
          type: string
          minLength: 1
          maxLength: 1024
          description: 触发下载的主框架控件的 CSS 选择器
        timeout_ms:
          type: integer
          minimum: 1
          maximum: 30000
          default: 10000
    BrowserDownload:
      type: object
      required: [ id, filename, artifact_digest, size_bytes, download_url, created_at ]
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        artifact_digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 8388608
        download_url:
          type: string
        created_at:
          type: string
          format: date-time
    BrowserSessionStatus:
      type: string
      enum: [ starting, ready, failed, closed ]
      x-enum-varnames: [ BrowserSessionStatusStarting, BrowserSessionStatusReady, BrowserSessionStatusFailed, BrowserSessionStatusClosed ]
    BrowserPage:
      type: object
      required: [ id, url, title, url_truncated, title_truncated ]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          maxLength: 4096
          description: 当前地址，最多 4096 个 UTF-8 字节
        url_truncated:
          type: boolean
        title:
          type: string
          maxLength: 512
          description: 当前标题，最多 512 个 UTF-16 单元
        title_truncated:
          type: boolean
    BrowserPageText:
      type: object
      required: [ title, title_truncated, text, text_truncated ]
      properties:
        title:
          type: string
