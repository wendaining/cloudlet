          type: boolean
        text:
          type: string
          maxLength: 4096
        text_truncated:
          type: boolean
    BrowserFormActionRequest:
      type: object
      additionalProperties: false
      required: [ action, selector, value ]
      properties:
        action:
          type: string
          enum: [ fill, select ]
        selector:
          type: string
          minLength: 1
          maxLength: 1024
          description: 唯一定位表单控件的 CSS 选择器
        value:
          type: string
          maxLength: 1024
          description: 填写文本或原生选项的 value。允许空字符串。
