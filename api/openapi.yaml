openapi: 3.1.0
info:
  title: Cloudlet Management API
  version: 0.1.0
paths:
  /api/v1/version:
    get:
      operationId: getVersion
      responses:
        '200':
          description: 构建版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        '204':
          description: 会话已清除
  /api/v1/auth/session:
    get:
      operationId: getSession
      responses:
        '200':
          $ref: '#/components/responses/User'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/environment:
    get:
      operationId: getEnvironment
      responses:
        '200':
          description: 当前实例与数据库状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '401':
          $ref: '#/components/responses/Error'
components:
  schemas:
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          maxLength: 72
    VersionInfo:
      type: object
      required: [version, commit]
      properties:
        version:
          type: string
        commit:
          type: string
    Environment:
      type: object
      required: [instance, database_version]
      properties:
        instance:
          type: string
        database_version:
          type: integer
          format: int64
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
  responses:
    User:
      description: 当前账号
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
    Error:
      description: 请求失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
