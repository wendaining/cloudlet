        version_id:
          type: string
          format: uuid
        hostname:
          type: string
        url:
          type: string
          format: uri
    StaticSiteActivationRequest:
      type: object
      additionalProperties: false
      required: [ expected_revision ]
      properties:
        expected_revision:
          type: string
          format: date-time
