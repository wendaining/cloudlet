          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
        database:
          type: string
          minLength: 1
          maxLength: 63
        secret_version_id:
          type: string
          format: uuid
        verified_at:
          type: string
          format: date-time
    S3BindingInput:
      type: object
      required: [ name, endpoint, region, bucket, secret_version_id ]
