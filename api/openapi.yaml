        docker_container_id:
          type: string
        target:
          type: string
        operation_phase:
          type: string
        operation_outcome:
          type: string
        generation:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    DeployWorkerRequest:
      type: object
      additionalProperties: false
      required:
        - module
        - compatibility_date
        - hostname
      properties:
        module:
          type: string
          minLength: 1
