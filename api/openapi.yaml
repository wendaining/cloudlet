        image:
          type: string
          maxLength: 512
          description: 包含不可变摘要的镜像引用，格式为 repository@sha256:digest。仅使用标签的引用会被拒绝。
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: 容器内 HTTP 服务监听的 TCP 端口。
        hostname:
          type: string
          maxLength: 253
          description: 无端口的公开域名，由 Gateway 提供根路径路由。
        cpu_millis:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
          description: 申请并限制的 CPU 毫核。
        memory_bytes:
          type: integer
          format: int64
          minimum: 1
          description: 申请并限制的内存字节。
        user:
          type: string
          maxLength: 128
          description: 非 root 运行身份，格式为 user 或 user:group。省略时使用 1000:1000。
        command:
          type: array
          maxItems: 64
          items:
            type: string
          description: 覆盖镜像命令的参数数组。省略时使用镜像默认命令。
        env:
          type: array
          maxItems: 128
          items:
            type: string
