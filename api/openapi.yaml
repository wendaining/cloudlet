        health_check_path:
          type: string
          maxLength: 2048
          default: /
          description: 就绪探测的绝对请求路径。
        health_check_timeout_ms:
          type: integer
          format: int64
          minimum: 1000
          maximum: 60000
          default: 15000
          description: 就绪探测的总截止时间。接受 200 至 399 的最终 HTTP 状态。
