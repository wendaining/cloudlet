    StaticSiteActivePublication:
      type: object
      required: [ site_id, version_id, hostname, url, revision ]
      properties:
        site_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        hostname:
          type: string
        url:
          type: string
          format: uri
        revision:
