openapi: 3.1.0
info:
  title: Cloudlet Management API
  version: 0.1.0
paths:
  /api/v1/version:
    get:
      operationId: getVersion
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 构建版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        default:
          $ref: '#/components/responses/Error'
        '204':
          description: 会话已清除
  /api/v1/auth/session:
    get:
      operationId: getSession
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/environment:
    get:
      operationId: getEnvironment
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 当前实例与数据库状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/projects:
    post:
      operationId: createProject
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          $ref: '#/components/responses/Project'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
    get:
      operationId: listProjects
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 当前用户可见的项目
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/operations:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listProjectOperations
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: 项目内操作，按创建时间升序返回
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectID}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getProject
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Project'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: renameProject
      description: 更新项目显示名称；仅项目所有者可以调用，项目 ID 与成员关系保持不变。
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameProjectRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Project'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/capacity:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getProjectCapacity
      description: 返回项目成员可见的项目额度、活动预留占用和剩余量；三个值来自同一数据库快照。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 项目 CPU、内存与实例容量使用快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCapacity'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/members:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listProjectMembers
      description: 返回项目成员及其角色，项目成员可以读取。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 项目成员及其角色
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMember'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: upsertProjectMember
      description: 添加已有账号为项目成员，或更新其 developer/viewer 角色；仅项目所有者可以调用。
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProjectMemberRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/ProjectMember'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/members/{userID}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
      - name: userID
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: removeProjectMember
      description: 移除项目成员；仅项目所有者可以调用，项目所有者不可移除。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '204':
          description: 成员已移除
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/browser-sessions:
    parameters:
      - $ref: '#/components/parameters/BrowserProjectID'
    post:
      operationId: createBrowserSession
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: 浏览器会话已就绪
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSession'
  /api/v1/projects/{projectID}/browser-sessions/{sessionID}:
    parameters:
      - $ref: '#/components/parameters/BrowserProjectID'
      - $ref: '#/components/parameters/BrowserSessionID'
    get:
      operationId: getBrowserSession
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 项目浏览器会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSession'
    delete:
      operationId: closeBrowserSession
      description: 停止容器并确认清理，释放容量后返回会话终态。重复关闭返回已有终态。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 已结束的浏览器会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSession'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/browser-sessions/{sessionID}/navigate:
    parameters:
      - $ref: '#/components/parameters/BrowserProjectID'
      - $ref: '#/components/parameters/BrowserSessionID'
    post:
      operationId: navigateBrowserSession
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NavigateBrowserSessionRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 导航后的页面地址和标题
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserNavigation'
  /api/v1/projects/{projectID}/browser-sessions/{sessionID}/console:
    parameters:
      - $ref: '#/components/parameters/BrowserProjectID'
      - $ref: '#/components/parameters/BrowserSessionID'
    get:
      operationId: getBrowserConsole
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 会话的最近控制台消息和页面错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserConsole'
  /api/v1/projects/{projectID}/browser-sessions/{sessionID}/screenshots:
    parameters:
      - $ref: '#/components/parameters/BrowserProjectID'
      - $ref: '#/components/parameters/BrowserSessionID'
    post:
      operationId: captureBrowserScreenshot
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: 截图已保存
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserScreenshot'
  /api/v1/projects/{projectID}/browser-sessions/{sessionID}/screenshots/{screenshotID}:
    parameters:
      - $ref: '#/components/parameters/BrowserProjectID'
      - $ref: '#/components/parameters/BrowserSessionID'
      - name: screenshotID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: downloadBrowserScreenshot
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 原始 PNG 截图
          content:
            image/png:
              schema:
                type: string
                format: binary
  /api/v1/projects/{projectID}/sites/{siteName}/versions:
    parameters:
      - $ref: '#/components/parameters/SiteProjectID'
      - $ref: '#/components/parameters/SiteName'
    post:
      operationId: uploadStaticSiteVersion
      description: 项目所有者上传不超过 64 MiB 的 ZIP，站点首次上传时建立项目内的稳定标识。返回已验证的待激活版本。
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: 已验证的待激活版本
          headers:
            Location:
              description: 查询新版本的管理 API 路径
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticSiteVersion'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/sites/{siteName}/versions/{versionID}:
    parameters:
      - $ref: '#/components/parameters/SiteProjectID'
      - $ref: '#/components/parameters/SiteName'
      - name: versionID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getStaticSiteVersion
      description: 项目成员按标识读取一个静态站点版本。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/StaticSiteVersion'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/secrets:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createProjectSecretVersion
      description: 为项目凭据追加一个加密版本，仅项目所有者可以调用。
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectSecretRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          $ref: '#/components/responses/ProjectSecretVersion'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      operationId: listProjectSecrets
      description: 返回项目凭据的名称与最新版本元数据，项目成员可以读取。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 项目凭据元数据
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSecret'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/secrets/{name}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'
    get:
      operationId: listProjectSecretVersions
      description: 返回指定项目凭据的版本元数据，不含明文。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 凭据版本元数据，按版本号降序返回
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSecretVersion'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/secrets/{name}/versions/{version}/value:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getProjectSecretValue
      description: 返回指定凭据版本的明文，仅项目所有者可以调用。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 凭据版本明文与元数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSecretValue'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/workers/{name}/deployments:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: deployWorker
      description: 发布首个无状态 Worker 版本，等待真实运行时就绪并激活域名。所有者和开发者可以调用。同一幂等键复用操作。
      security:
        - SessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployWorkerRequest"
      responses:
        "200":
          description: 已存在的发布结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerDeployment"
          headers:
            Location:
              description: 已登记版本的项目内查询地址。版本尚未登记时省略。
              schema:
                type: string
        "201":
          description: 新 Worker 发布结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerDeployment"
          headers:
            Location:
              description: 已登记版本的项目内查询地址。版本尚未登记时省略。
              schema:
                type: string
        "400":
          description: Worker 发布请求参数无效
          headers:
            Location:
              description: 已登记版本的项目内查询地址。版本尚未登记时省略。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Worker 发布请求冲突
          headers:
            Location:
              description: 已登记版本的项目内查询地址。版本尚未登记时省略。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: 运行时预检或就绪检查失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerDeployment"
          headers:
            Location:
              description: 已登记版本的项目内查询地址。版本尚未登记时省略。
              schema:
                type: string
        "429":
          description: 容量不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerDeployment"
          headers:
            Location:
              description: 已登记版本的项目内查询地址。版本尚未登记时省略。
              schema:
                type: string
        "500":
          description: Worker 发布步骤失败
          headers:
            Location:
              description: 已登记版本的项目内查询地址。版本尚未登记时省略。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectID}/worker-deployments/{deploymentID}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
      - name: deploymentID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getWorkerDeployment
      description: 项目成员查询不可变 Worker 版本、执行与操作结果。
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Worker 发布结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerDeployment"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    BrowserProjectID:
      name: projectID
      in: path
      required: true
      schema:
        type: string
    BrowserSessionID:
      name: sessionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SiteProjectID:
      name: projectID
      in: path
      required: true
      schema:
        type: string
    SiteName:
      name: siteName
      in: path
      required: true
      schema:
        type: string
        maxLength: 63
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: cloudlet_default_session
      description: 会话 Cookie 名称为 cloudlet_实例名称_session，默认实例名称为 default。
  schemas:
    User:
      type: object
      required: [ id, email ]
      properties:
        id:
          type: string
        email:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [ email, password ]
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          maxLength: 72
    VersionInfo:
      type: object
      required: [ version, commit ]
      properties:
        version:
          type: string
        commit:
          type: string
    Environment:
      type: object
      required: [ instance, database_version ]
      properties:
        instance:
          type: string
        database_version:
          type: integer
          format: int64
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [ name ]
      properties:
        name:
          type: string
          description: 服务端去除首尾空白后必须包含 1 至 100 个 Unicode 字符；原始字符串可以包含首尾空白。
    RenameProjectRequest:
      type: object
      additionalProperties: false
      required: [ name ]
      properties:
        name:
          type: string
          description: 服务端去除首尾空白后必须包含 1 至 100 个 Unicode 字符；原始字符串可以包含首尾空白。
    Project:
      type: object
      required: [ id, name ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    ProjectRole:
      type: string
      enum: [owner, developer, viewer]
    ResourceAmounts:
      type: object
      required: [cpu_millis, memory_bytes, instances]
      properties:
        cpu_millis:
          type: integer
          format: int64
          minimum: 0
          description: CPU 毫核。
        memory_bytes:
          type: integer
          format: int64
          minimum: 0
          description: 内存字节。
        instances:
          type: integer
          format: int64
          minimum: 0
          description: 实例数。
    ProjectCapacity:
      type: object
      description: 项目配额与活动预留快照。used 可能超过 limit；remaining 是按资源钳制后的额度内余量，不表示超用标记。
      required: [project_id, limit, used, remaining]
      properties:
        project_id:
          type: string
          format: uuid
        limit:
          $ref: '#/components/schemas/ResourceAmounts'
        used:
          $ref: '#/components/schemas/ResourceAmounts'
        remaining:
          $ref: '#/components/schemas/ResourceAmounts'
    ProjectMemberRole:
      type: string
      enum: [ developer, viewer ]
    ProjectMember:
      type: object
      required: [ user_id, email, role ]
      properties:
        user_id:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/ProjectRole'
    ProjectSecret:
      type: object
      required: [ id, name, latest_version, created_at, updated_at ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        latest_version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectSecretVersion:
      type: object
      required: [ id, secret_id, name, version, created_at ]
      properties:
        id:
          type: string
          format: uuid
        secret_id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
    ProjectSecretValue:
      type: object
      required: [ id, secret_id, name, version, created_at, value ]
      properties:
        id:
          type: string
          format: uuid
        secret_id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        value:
          type: string
    CreateProjectSecretRequest:
      type: object
      additionalProperties: false
      required: [ name, value ]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'
        value:
          type: string
          minLength: 1
          description: UTF-8 编码后包含 1 至 65536 字节。
    UpsertProjectMemberRequest:
      type: object
      additionalProperties: false
      required: [ email, role ]
      properties:
        email:
          type: string
          description: 已有账号的邮箱；服务端去除首尾空白并转为小写后查找。
          minLength: 1
          maxLength: 254
        role:
          $ref: '#/components/schemas/ProjectMemberRole'
    Session:
      type: object
      required: [ user, projects ]
      properties:
        user:
          $ref: "#/components/schemas/User"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    BrowserConsoleEntry:
      type: object
      required: [kind, level, message, truncated]
      properties:
        kind:
          type: string
          description: console 表示控制台消息，page_error 表示未捕获的页面错误
        level:
          type: string
        message:
          type: string
          maxLength: 512
        truncated:
          type: boolean
    BrowserConsole:
      type: object
      required: [entries, dropped]
      properties:
        entries:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/BrowserConsoleEntry'
        dropped:
          type: integer
          format: int64
          minimum: 0
          description: 已从会话历史移除的旧记录数
    BrowserScreenshot:
      type: object
      required: [id, artifact_digest, size_bytes, download_url, created_at]
      properties:
        id:
          type: string
          format: uuid
        artifact_digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: 原始 PNG 的 SHA-256 摘要
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 2097152
        download_url:
          type: string
          description: 需要项目会话凭据的相对下载地址
        created_at:
          type: string
          format: date-time
    BrowserSessionStatus:
      type: string
      enum: [starting, ready, failed, closed]
      x-enum-varnames: [BrowserSessionStatusStarting, BrowserSessionStatusReady, BrowserSessionStatusFailed, BrowserSessionStatusClosed]
    BrowserSession:
      type: object
      required: [id, endpoint, expires_at, status]
      properties:
        id:
          type: string
          format: uuid
        endpoint:
          type: string
          description: 需要项目会话凭据的相对管理 API 地址
        expires_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/BrowserSessionStatus'
    NavigateBrowserSessionRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          maxLength: 4096
    BrowserNavigation:
      type: object
      required: [url, title]
      properties:
        url:
          type: string
        title:
          type: string
    StaticSiteVersion:
      type: object
      required: [id, site_id, artifact_digest, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        artifact_digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
        status:
          type: string
          enum: [ready]
          description: 站点文件已通过校验并准备就绪，等待激活。
        created_at:
          type: string
          format: date-time
    Operation:
      type: object
      required: [ id, action, phase, outcome, created_at, updated_at ]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        phase:
          type: string
        outcome:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [ message ]
      properties:
        message:
          type: string
    DeployWorkerRequest:
      type: object
      additionalProperties: false
      required:
        - module
        - compatibility_date
        - hostname
      properties:
        module:
          type: string
          minLength: 1
          description: 已打包的单文件 JavaScript ES Module，UTF-8 编码后最多 1048576 字节。入口固定为 index.mjs。
        compatibility_date:
          type: string
          format: date
          description: 固定 workerd 支持的兼容日期。
        hostname:
          type: string
          maxLength: 253
          description: 无端口的公开域名。
    WorkerDeployment:
      type: object
      required:
        - id
        - project_id
        - worker_id
        - execution_id
        - operation_id
        - artifact_digest
        - config_digest
        - entry
        - compatibility_date
        - runtime_version
        - runtime_image
        - hostname
        - state
        - failure
        - container_id
        - execution_state
        - operation_phase
        - operation_outcome
        - cpu_millis
        - memory_bytes
        - generation
        - created_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        execution_id:
          type: string
          format: uuid
        operation_id:
          type: string
          format: uuid
        artifact_digest:
          type: string
        config_digest:
          type: string
        entry:
          type: string
        compatibility_date:
          type: string
        runtime_version:
          type: string
        runtime_image:
          type: string
        hostname:
          type: string
        state:
          type: string
        failure:
          type: string
        container_id:
          type: string
        execution_state:
          type: string
        operation_phase:
          type: string
        operation_outcome:
          type: string
        cpu_millis:
          type: integer
          format: int64
        memory_bytes:
          type: integer
          format: int64
        generation:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
  responses:
    StaticSiteVersion:
      description: 不可变静态站点版本
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StaticSiteVersion'
    Project:
      description: 项目身份
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Project'
    ProjectMember:
      description: 项目成员
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectMember'
    ProjectSecretVersion:
      description: 凭据版本元数据，不含明文
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectSecretVersion'
    User:
      description: 当前账号
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
    Session:
      description: 当前账号与可见项目
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Session"
    Error:
      description: 请求失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
