openapi: 3.1.0
info:
  title: Cloudlet Management API
  version: 0.1.0
paths:
  /api/v1/version:
    get:
      operationId: getVersion
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 构建版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        default:
          $ref: '#/components/responses/Error'
        '204':
          description: 会话已清除
  /api/v1/auth/session:
    get:
      operationId: getSession
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/environment:
    get:
      operationId: getEnvironment
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 当前实例与数据库状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/projects:
    post:
      operationId: createProject
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          $ref: '#/components/responses/Project'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
    get:
      operationId: listProjects
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 当前用户可见的项目
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/operations:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listProjectOperations
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: 项目内操作，按创建时间升序返回
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectID}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getProject
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Project'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: renameProject
      description: 更新项目显示名称；仅项目所有者可以调用，项目 ID 与成员关系保持不变。
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameProjectRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Project'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/capacity:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getProjectCapacity
      description: 返回项目成员可见的项目额度、活动预留占用和剩余量；三个值来自同一数据库快照。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 项目 CPU、内存与实例容量使用快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCapacity'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateProjectCapacity
      description: 项目所有者调整项目额度。三个额度字段都必须提供且为正整数；新额度低于活动预留占用时返回 409，原额度与预留保持不变。
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectCapacityRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 调整后的项目额度、活动预留占用与剩余量；三个值来自同一数据库事务。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCapacity'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/members:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listProjectMembers
      description: 返回项目成员及其角色，项目成员可以读取。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 项目成员及其角色
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMember'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: upsertProjectMember
      description: 添加已有账号为项目成员，或更新其 developer/viewer 角色；仅项目所有者可以调用。
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProjectMemberRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/ProjectMember'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/members/{userID}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
      - name: userID
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: removeProjectMember
      description: 移除项目成员；仅项目所有者可以调用，项目所有者不可移除。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '204':
          description: 成员已移除
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/browser-sessions:
    parameters:
      - $ref: '#/components/parameters/BrowserProjectID'
    post:
      operationId: createBrowserSession
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: 浏览器会话已就绪
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSession'
    get:
      operationId: listBrowserSessions
      security:
        - SessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: before
          in: query
          schema:
            type: string
            format: uuid
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 按创建时间倒序排列的项目浏览器会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSessionPage'
  /api/v1/projects/{projectID}/browser-sessions/{sessionID}:
    parameters:
      - $ref: '#/components/parameters/BrowserProjectID'
      - $ref: '#/components/parameters/BrowserSessionID'
    get:
      operationId: getBrowserSession
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 项目浏览器会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSession'
    delete:
      operationId: closeBrowserSession
      description: 停止容器并确认清理，释放容量后返回会话终态。重复关闭返回已有终态。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 已结束的浏览器会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserSession'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/browser-sessions/{sessionID}/pages:
    parameters:
      - $ref: '#/components/parameters/BrowserProjectID'
      - $ref: '#/components/parameters/BrowserSessionID'
    post:
      operationId: openBrowserPage
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: 已打开的额外页面
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserPage'
  /api/v1/projects/{projectID}/browser-sessions/{sessionID}/pages/{pageID}:
    parameters:
      - $ref: '#/components/parameters/BrowserProjectID'
      - $ref: '#/components/parameters/BrowserSessionID'
      - name: pageID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getBrowserPage
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 页面当前地址与标题
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserPage'
    delete:
      operationId: closeBrowserPage
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '204':
          description: 额外页面已关闭
  /api/v1/projects/{projectID}/browser-sessions/{sessionID}/text:
    parameters:
      - $ref: '#/components/parameters/BrowserProjectID'
      - $ref: '#/components/parameters/BrowserSessionID'
    get:
      operationId: getBrowserPageText
      security:
        - SessionCookie: []
      parameters:
        - name: selector
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 1024
          description: 可选 CSS 选择器，唯一限定文本范围
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 页面标题及限定范围的可见文本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserPageText'
  /api/v1/projects/{projectID}/browser-sessions/{sessionID}/form:
    parameters:
      - $ref: '#/components/parameters/BrowserProjectID'
      - $ref: '#/components/parameters/BrowserSessionID'
    post:
      operationId: applyBrowserFormAction
      description: 填写输入或选择原生选项，使用点击接口提交表单。
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserFormActionRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '204':
          description: 表单操作已完成
  /api/v1/projects/{projectID}/browser-sessions/{sessionID}/click:
    parameters:
      - $ref: '#/components/parameters/BrowserProjectID'
      - $ref: '#/components/parameters/BrowserSessionID'
    post:
      operationId: clickBrowserPage
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClickBrowserPageRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '204':
          description: 已点击当前页面的指定元素
  /api/v1/projects/{projectID}/browser-sessions/{sessionID}/navigate:
    parameters:
      - $ref: '#/components/parameters/BrowserProjectID'
      - $ref: '#/components/parameters/BrowserSessionID'
    post:
      operationId: navigateBrowserSession
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NavigateBrowserSessionRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 导航后的页面地址和标题
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserNavigation'
  /api/v1/projects/{projectID}/browser-sessions/{sessionID}/console:
    parameters:
      - $ref: '#/components/parameters/BrowserProjectID'
      - $ref: '#/components/parameters/BrowserSessionID'
    get:
      operationId: getBrowserConsole
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 会话的最近控制台消息和页面错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserConsole'
  /api/v1/projects/{projectID}/browser-sessions/{sessionID}/screenshots:
    parameters:
      - $ref: '#/components/parameters/BrowserProjectID'
      - $ref: '#/components/parameters/BrowserSessionID'
    post:
      operationId: captureBrowserScreenshot
      security:
        - SessionCookie: []
      parameters:
        - name: full_page
          in: query
          description: 截取整个可滚动页面，省略时截取当前视口。
          schema:
            type: boolean
            default: false
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: 截图已保存
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserScreenshot'
        '422':
          description: 截图超过 4194304 设备像素或 2 MiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{projectID}/browser-sessions/{sessionID}/screenshots/{screenshotID}:
    parameters:
      - $ref: '#/components/parameters/BrowserProjectID'
      - $ref: '#/components/parameters/BrowserSessionID'
      - name: screenshotID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: downloadBrowserScreenshot
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 原始 PNG 截图
          content:
            image/png:
              schema:
                type: string
                format: binary
  /api/v1/projects/{projectID}/sites:
    parameters:
      - $ref: '#/components/parameters/SiteProjectID'
    get:
      operationId: listStaticSites
      description: 按站点名称升序分页列出项目成员可见的静态站点。
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/StaticSitePageLimit'
        - $ref: '#/components/parameters/StaticSitePageCursor'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 项目站点列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticSitePage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/browser-sessions/{sessionID}/downloads:
    parameters:
      - $ref: '#/components/parameters/BrowserProjectID'
      - $ref: '#/components/parameters/BrowserSessionID'
    post:
      operationId: captureBrowserDownload
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureBrowserDownloadRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: 完整下载已保存为项目产物
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserDownload'
        '422':
          description: 下载失败或超过 8 MiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/projects/{projectID}/browser-sessions/{sessionID}/downloads/{downloadID}:
    parameters:
      - $ref: '#/components/parameters/BrowserProjectID'
      - $ref: '#/components/parameters/BrowserSessionID'
      - name: downloadID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getBrowserDownload
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 已保存下载产物的原始字节
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /api/v1/projects/{projectID}/sites/{siteName}/versions:
    parameters:
      - $ref: '#/components/parameters/SiteProjectID'
      - $ref: '#/components/parameters/SiteName'
    post:
      operationId: uploadStaticSiteVersion
      description: 项目所有者上传不超过 64 MiB 的 ZIP，站点首次上传时建立项目内的稳定标识。返回已验证的待激活版本。
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: 已验证的待激活版本
          headers:
            Location:
              description: 查询新版本的管理 API 路径
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticSiteVersion'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
    get:
      operationId: listStaticSiteVersions
      description: 按创建时间和版本标识降序分页列出站点版本摘要。
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/StaticSitePageLimit'
        - $ref: '#/components/parameters/StaticSitePageCursor'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 静态站点版本列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticSiteVersionPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/sites/{siteName}/versions/{versionID}:
    parameters:
      - $ref: '#/components/parameters/SiteProjectID'
      - $ref: '#/components/parameters/SiteName'
      - name: versionID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getStaticSiteVersion
      description: 项目成员按标识读取一个静态站点版本。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/StaticSiteVersion'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/sites/{siteName}/versions/{versionID}/artifact:
    parameters:
      - $ref: '#/components/parameters/SiteProjectID'
      - $ref: '#/components/parameters/SiteName'
      - name: versionID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: downloadStaticSiteArtifact
      description: 项目成员下载指定站点版本的原始 ZIP。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 原始 ZIP 的全部字节
          headers:
            Content-Disposition:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
                format: int64
            Content-Digest:
              description: ZIP 内容的 SHA-256 摘要。
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/sites/{siteName}/versions/{versionID}/publish:
    parameters:
      - $ref: '#/components/parameters/SiteProjectID'
      - $ref: '#/components/parameters/SiteName'
      - name: versionID
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: publishStaticSiteVersion
      description: 项目所有者绑定域名并激活站点的首个就绪版本。重复相同请求返回同一发布结果。
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
