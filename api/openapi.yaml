openapi: 3.1.0
info:
  title: Cloudlet Management API
  version: 0.1.0
paths:
  /api/v1/version:
    get:
      operationId: getVersion
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 构建版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        default:
          $ref: '#/components/responses/Error'
        '204':
          description: 会话已清除
  /api/v1/auth/session:
    get:
      operationId: getSession
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/environment:
    get:
      operationId: getEnvironment
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 当前实例与数据库状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/projects:
    post:
      operationId: createProject
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          $ref: '#/components/responses/Project'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
    get:
      operationId: listProjects
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 当前用户可见的项目
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/operations:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listProjectOperations
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: 项目内操作，按创建时间升序返回
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectID}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getProject
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Project'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: renameProject
      description: 更新项目显示名称；仅项目所有者可以调用，项目 ID 与成员关系保持不变。
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameProjectRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Project'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/members:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listProjectMembers
      description: 返回项目成员及其角色，项目成员可以读取。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 项目成员及其角色
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMember'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: upsertProjectMember
      description: 添加已有账号为项目成员，或更新其 developer/viewer 角色；仅项目所有者可以调用。
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProjectMemberRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/ProjectMember'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/members/{userID}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
      - name: userID
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: removeProjectMember
      description: 移除项目成员；仅项目所有者可以调用，项目所有者不可移除。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '204':
          description: 成员已移除
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/secrets:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createProjectSecretVersion
      description: 为项目凭据追加一个加密版本，仅项目所有者可以调用。
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectSecretRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          $ref: '#/components/responses/ProjectSecretVersion'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      operationId: listProjectSecrets
      description: 返回项目凭据的名称与最新版本元数据，项目成员可以读取。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 项目凭据元数据
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSecret'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/secrets/{name}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'
    get:
      operationId: listProjectSecretVersions
      description: 返回指定项目凭据的版本元数据，不含明文。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 凭据版本元数据，按版本号降序返回
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSecretVersion'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/secrets/{name}/versions/{version}/value:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getProjectSecretValue
      description: 返回指定凭据版本的明文，仅项目所有者可以调用。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 凭据版本明文与元数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSecretValue'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: cloudlet_default_session
      description: 会话 Cookie 名称为 cloudlet_实例名称_session，默认实例名称为 default。
  schemas:
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          maxLength: 72
    VersionInfo:
      type: object
      required: [version, commit]
      properties:
        version:
          type: string
        commit:
          type: string
    Environment:
      type: object
      required: [instance, database_version]
      properties:
        instance:
          type: string
        database_version:
          type: integer
          format: int64
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: 服务端去除首尾空白后必须包含 1 至 100 个 Unicode 字符；原始字符串可以包含首尾空白。
    RenameProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: 服务端去除首尾空白后必须包含 1 至 100 个 Unicode 字符；原始字符串可以包含首尾空白。
    Project:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    ProjectRole:
      type: string
      enum: [owner, developer, viewer]
    ProjectMemberRole:
      type: string
      enum: [developer, viewer]
    ProjectMember:
      type: object
      required: [user_id, email, role]
      properties:
        user_id:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/ProjectRole'
    ProjectSecret:
      type: object
      required: [id, name, latest_version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        latest_version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectSecretVersion:
      type: object
      required: [id, secret_id, name, version, created_at]
      properties:
        id:
          type: string
          format: uuid
        secret_id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
    ProjectSecretValue:
      type: object
      required: [id, secret_id, name, version, created_at, value]
      properties:
        id:
          type: string
          format: uuid
        secret_id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        value:
          type: string
    CreateProjectSecretRequest:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'
        value:
          type: string
          minLength: 1
          description: UTF-8 编码后包含 1 至 65536 字节。
    UpsertProjectMemberRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          description: 已有账号的邮箱；服务端去除首尾空白并转为小写后查找。
          minLength: 1
          maxLength: 254
        role:
          $ref: '#/components/schemas/ProjectMemberRole'
    Session:
      type: object
      required: [user, projects]
      properties:
        user:
          $ref: "#/components/schemas/User"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    Operation:
      type: object
      required: [id, action, phase, outcome, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        phase:
          type: string
        outcome:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
  responses:
    Project:
      description: 项目身份
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Project'
    ProjectMember:
      description: 项目成员
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectMember'
    ProjectSecretVersion:
      description: 凭据版本元数据，不含明文
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectSecretVersion'
    User:
      description: 当前账号
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
    Session:
      description: 当前账号与可见项目
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Session"
    Error:
      description: 请求失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
