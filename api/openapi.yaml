        - runtime_version
        - runtime_image
        - hostname
        - state
        - failure
        - container_id
        - execution_state
        - operation_phase
        - operation_outcome
        - cpu_millis
        - memory_bytes
        - generation
        - created_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        execution_id:
          type: string
          format: uuid
        operation_id:
          type: string
          format: uuid
        artifact_digest:
          type: string
        config_digest:
          type: string
        entry:
          type: string
        compatibility_date:
          type: string
        runtime_version:
          type: string
        runtime_image:
          type: string
        hostname:
          type: string
        state:
          type: string
        failure:
          type: string
        container_id:
          type: string
        execution_state:
          type: string
        operation_phase:
          type: string
        operation_outcome:
          type: string
        cpu_millis:
          type: integer
          format: int64
        memory_bytes:
          type: integer
          format: int64
        generation:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    PostgresBindingInput:
      type: object
