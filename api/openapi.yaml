openapi: 3.1.0
info:
  title: Cloudlet Management API
  version: 0.1.0
paths:
  /api/v1/version:
    get:
      operationId: getVersion
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 构建版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/User'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        default:
          $ref: '#/components/responses/Error'
        '204':
          description: 会话已清除
  /api/v1/auth/session:
    get:
      operationId: getSession
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/User'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/environment:
    get:
      operationId: getEnvironment
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 当前实例与数据库状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/projects:
    post:
      operationId: createProject
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          $ref: '#/components/responses/Project'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
    get:
      operationId: listProjects
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 当前用户可见的项目
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getProject
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Project'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: cloudlet_default_session
      description: 会话 Cookie 名称为 cloudlet_实例名称_session，默认实例名称为 default。
  schemas:
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          maxLength: 72
    VersionInfo:
      type: object
      required: [version, commit]
      properties:
        version:
          type: string
        commit:
          type: string
    Environment:
      type: object
      required: [instance, database_version]
      properties:
        instance:
          type: string
        database_version:
          type: integer
          format: int64
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 去除首尾空白后的项目名称。
    Project:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
  responses:
    Project:
      description: 项目身份
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Project'
    User:
      description: 当前账号
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
    Error:
      description: 请求失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
