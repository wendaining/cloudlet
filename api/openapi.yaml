        created_at:
          type: string
          format: date-time
    Operation:
      type: object
      required: [ id, action, phase, outcome, created_at, updated_at ]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        phase:
          type: string
        outcome:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [ message ]
      properties:
        message:
          type: string
    CreateContainerRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - image
        - port
        - hostname
        - cpu_millis
        - memory_bytes
      properties:
        name:
          type: string
          maxLength: 63
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
