        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        execution_id:
          type: string
          format: uuid
        operation_id:
          type: string
          format: uuid
        name:
          type: string
        image:
          type: string
        image_digest:
          type: string
        port:
          type: integer
        hostname:
          type: string
        path_prefix:
          type: string
        cpu_millis:
          type: integer
          format: int64
        memory_bytes:
          type: integer
          format: int64
        pids:
          type: integer
          format: int64
        open_files:
          type: integer
          format: int64
        user:
          type: string
        command:
          type: array
          items:
            type: string
        env:
          type: array
          items:
            type: string
        health_check_path:
          type: string
        health_check_timeout_ms:
          type: integer
          format: int64
        state:
          type: string
          description: 容器目标状态，取值为 pending、active、stopped 或 failed。
        failure:
          type: string
        execution_state:
          type: string
