openapi: 3.1.0
info:
  title: Cloudlet Management API
  version: 0.1.0
paths:
  /api/v1/version:
    get:
      operationId: getVersion
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 构建版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Session'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        default:
          $ref: '#/components/responses/Error'
        '204':
          description: 会话已清除
  /api/v1/auth/session:
    get:
      operationId: getSession
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Session'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/environment:
    get:
      operationId: getEnvironment
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 当前实例与数据库状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/projects:
    post:
      operationId: createProject
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          $ref: '#/components/responses/Project'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
    get:
      operationId: listProjects
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 当前用户可见的项目
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/operations:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listProjectOperations
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: 项目内操作，按创建时间升序返回
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectID}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getProject
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Project'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: renameProject
      description: 更新项目显示名称；仅项目所有者可以调用，项目 ID 与成员关系保持不变。
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameProjectRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/Project'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/members:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listProjectMembers
      description: 返回项目成员及其角色，项目成员可以读取。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 项目成员及其角色
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMember'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: upsertProjectMember
      description: 添加已有账号为项目成员，或更新其 developer/viewer 角色；仅项目所有者可以调用。
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProjectMemberRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          $ref: '#/components/responses/ProjectMember'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/members/{userID}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
      - name: userID
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: removeProjectMember
      description: 移除项目成员；仅项目所有者可以调用，项目所有者不可移除。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '204':
          description: 成员已移除
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/secrets:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createProjectSecretVersion
      description: 为项目凭据追加一个加密版本，仅项目所有者可以调用。
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectSecretRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          $ref: '#/components/responses/ProjectSecretVersion'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      operationId: listProjectSecrets
      description: 返回项目凭据的名称与最新版本元数据，项目成员可以读取。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 项目凭据元数据
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSecret'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/secrets/{name}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'
    get:
      operationId: listProjectSecretVersions
      description: 返回指定项目凭据的版本元数据，不含明文。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 凭据版本元数据，按版本号降序返回
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSecretVersion'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/secrets/{name}/versions/{version}/value:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getProjectSecretValue
      description: 返回指定凭据版本的明文，仅项目所有者可以调用。
      security:
        - SessionCookie: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: 凭据版本明文与元数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSecretValue'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectID}/workers/{name}/deployments:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: deployWorker
      description: 发布首个无状态 Worker 版本，等待真实运行时就绪并激活域名。所有者和开发者可以调用。同一幂等键复用操作。
      security:
        - SessionCookie: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployWorkerRequest"
      responses:
        "200":
          description: 已存在的发布结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerDeployment"
        "201":
          description: 新 Worker 发布结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerDeployment"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          description: 运行时预检或就绪检查失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerDeployment"
        "429":
          description: 容量不足
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerDeployment"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/projects/{projectID}/worker-deployments/{deploymentID}:
    parameters:
      - name: projectID
        in: path
        required: true
        schema:
          type: string
      - name: deploymentID
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getWorkerDeployment
      description: 项目成员查询不可变 Worker 版本、执行与操作结果。
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Worker 发布结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerDeployment"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: cloudlet_default_session
      description: 会话 Cookie 名称为 cloudlet_实例名称_session，默认实例名称为 default。
  schemas:
    User:
      type: object
      required: [ id, email ]
      properties:
        id:
          type: string
        email:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [ email, password ]
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          maxLength: 72
    VersionInfo:
      type: object
      required: [ version, commit ]
      properties:
        version:
          type: string
        commit:
          type: string
    Environment:
      type: object
      required: [ instance, database_version ]
      properties:
        instance:
          type: string
        database_version:
          type: integer
          format: int64
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [ name ]
      properties:
        name:
          type: string
          description: 服务端去除首尾空白后必须包含 1 至 100 个 Unicode 字符；原始字符串可以包含首尾空白。
    RenameProjectRequest:
      type: object
      additionalProperties: false
      required: [ name ]
      properties:
        name:
          type: string
          description: 服务端去除首尾空白后必须包含 1 至 100 个 Unicode 字符；原始字符串可以包含首尾空白。
    Project:
      type: object
      required: [ id, name ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    ProjectRole:
      type: string
      enum: [ owner, developer, viewer ]
    ProjectMemberRole:
      type: string
      enum: [ developer, viewer ]
    ProjectMember:
      type: object
      required: [ user_id, email, role ]
      properties:
        user_id:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/ProjectRole'
    ProjectSecret:
      type: object
      required: [ id, name, latest_version, created_at, updated_at ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        latest_version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectSecretVersion:
      type: object
      required: [ id, secret_id, name, version, created_at ]
      properties:
        id:
          type: string
          format: uuid
        secret_id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
    ProjectSecretValue:
      type: object
      required: [ id, secret_id, name, version, created_at, value ]
      properties:
        id:
          type: string
          format: uuid
        secret_id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        value:
          type: string
    CreateProjectSecretRequest:
      type: object
      additionalProperties: false
      required: [ name, value ]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'
        value:
          type: string
          minLength: 1
          description: UTF-8 编码后包含 1 至 65536 字节。
    UpsertProjectMemberRequest:
      type: object
      additionalProperties: false
      required: [ email, role ]
      properties:
        email:
          type: string
          description: 已有账号的邮箱；服务端去除首尾空白并转为小写后查找。
          minLength: 1
          maxLength: 254
        role:
          $ref: '#/components/schemas/ProjectMemberRole'
    Session:
      type: object
      required: [ user, projects ]
      properties:
        user:
          $ref: "#/components/schemas/User"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    Operation:
      type: object
      required: [ id, action, phase, outcome, created_at, updated_at ]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        phase:
          type: string
        outcome:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [ message ]
      properties:
        message:
          type: string
    DeployWorkerRequest:
      type: object
      additionalProperties: false
      required:
        - module
        - compatibility_date
        - hostname
      properties:
        module:
          type: string
          minLength: 1
          description: 已打包的单文件 JavaScript ES Module，UTF-8 编码后最多 1048576 字节。入口固定为 index.mjs。
        compatibility_date:
          type: string
          format: date
          description: 固定 workerd 支持的兼容日期。
        hostname:
          type: string
          maxLength: 253
          description: 无端口的公开域名。
    WorkerDeployment:
      type: object
      required:
        - id
        - project_id
        - worker_id
        - execution_id
        - operation_id
        - artifact_digest
        - config_digest
        - entry
        - compatibility_date
        - runtime_version
        - runtime_image
        - hostname
        - state
        - failure
        - container_id
        - execution_state
        - operation_phase
        - operation_outcome
        - cpu_millis
        - memory_bytes
        - generation
        - created_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        execution_id:
          type: string
          format: uuid
        operation_id:
          type: string
          format: uuid
        artifact_digest:
          type: string
        config_digest:
          type: string
        entry:
          type: string
        compatibility_date:
          type: string
        runtime_version:
          type: string
        runtime_image:
          type: string
        hostname:
          type: string
        state:
          type: string
        failure:
          type: string
        container_id:
          type: string
        execution_state:
          type: string
        operation_phase:
          type: string
        operation_outcome:
          type: string
        cpu_millis:
          type: integer
          format: int64
        memory_bytes:
          type: integer
          format: int64
        generation:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
  responses:
    Project:
      description: 项目身份
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Project'
    ProjectMember:
      description: 项目成员
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectMember'
    ProjectSecretVersion:
      description: 凭据版本元数据，不含明文
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectSecretVersion'
    User:
      description: 当前账号
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
    Session:
      description: 当前账号与可见项目
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Session"
    Error:
      description: 请求失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
