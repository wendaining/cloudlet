name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      full:
        description: 执行全部发布前检查
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ inputs.full || steps.paths.outputs.docs == 'true' }}
      go: ${{ inputs.full || steps.paths.outputs.go == 'true' }}
      tooling: ${{ inputs.full || steps.paths.outputs.tooling == 'true' }}
      workflows: ${{ inputs.full || steps.paths.outputs.workflows == 'true' }}
      container: ${{ inputs.full || steps.paths.outputs.container == 'true' }}
      database: ${{ inputs.full || steps.paths.outputs.database == 'true' }}
      routes: ${{ inputs.full || steps.paths.outputs.routes == 'true' }}
      workers: ${{ inputs.full || steps.paths.outputs.workers == 'true' }}
      browser: ${{ inputs.full || steps.paths.outputs.browser == 'true' }}
      containers: ${{ inputs.full || steps.paths.outputs.containers == 'true' }}
      executions: ${{ inputs.full || steps.paths.outputs.executions == 'true' }}
      web: ${{ inputs.full || steps.paths.outputs.web == 'true' }}
      development: ${{ inputs.full || steps.paths.outputs.development == 'true' }}
      e2e: ${{ inputs.full || steps.paths.outputs.e2e == 'true' }}
      packaging: ${{ steps.paths.outputs.packaging == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: ${{ !inputs.full }}
        id: paths
        with:
          filters: .github/ci-paths.yml
          predicate-quantifier: some-with-excludes
          base: ${{ github.event_name == 'push' && github.ref || '' }}
      - name: Check path coverage
        if: steps.paths.outputs.unclassified == 'true'
        run: |
          echo '请在 .github/ci-paths.yml 中配置新增文件对应的检查范围'
          exit 1
  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --workspaces=false
      - run: npm run lint:docs
  go:
    name: Go
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make format-check test build
        if: needs.changes.outputs.go == 'true'
      - run: go vet ./cmd/... ./internal/... ./pkg/... ./migrations/...
        if: needs.changes.outputs.go == 'true'
      - run: go tool govulncheck ./cmd/... ./internal/... ./pkg/... ./migrations/...
        if: needs.changes.outputs.go == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.go == 'true'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --workspaces=false
        if: needs.changes.outputs.go == 'true'
      - run: make generate-check
        if: needs.changes.outputs.go == 'true'
      - run: sh scripts/release.sh ci
        if: needs.changes.outputs.packaging == 'true'
      - run: shasum -a 256 -c SHA256SUMS
        if: needs.changes.outputs.packaging == 'true'
        working-directory: dist
  tooling:
    name: Tooling
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit
      - run: npm run lint:config
      - run: npm run lint:tooling
  workflows:
    name: Workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go tool actionlint
  container:
    name: Container
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make container-check
  database:
    name: Database
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -tags=integration ./internal/database ./internal/capacity
  routes:
    name: Routes
    needs: changes
    if: needs.changes.outputs.routes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -tags=integration -v ./internal/routes
  workers:
    name: Workers
    needs: changes
    if: needs.changes.outputs.workers == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit
      - run: npm run check --workspace runtimes/workers
      - run: go test -race -count=1 -tags=integration -v ./internal/workers ./internal/workerpublish
  browser:
    name: Browser Run
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: runtimes/browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtimes/browser/package-lock.json
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run check
      - run: npm run test:integration
  containers:
    name: Containers
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -tags=integration ./internal/containers
  executions:
    name: Executions
    needs: changes
    if: needs.changes.outputs.executions == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -tags=integration ./internal/executions
  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit
      - run: make web-check
  development:
    name: Development
    needs: changes
    if: needs.changes.outputs.development == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit
      - run: make dev-check
  e2e:
    name: E2E
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      - run: make test-e2e
  required:
    name: CI
    if: always()
    needs: [changes, docs, go, tooling, workflows, container, containers, executions, database, routes, workers, browser, web, development, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      CI_NEEDS: ${{ toJSON(needs) }}
    steps:
      - run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const needs = JSON.parse(process.env.CI_NEEDS);
          assert.equal(needs.changes.result, 'success', '改动范围检查必须通过');
          const scopes = needs.changes.outputs;
          for (const name of ['docs', 'go', 'tooling', 'workflows', 'container', 'containers', 'executions', 'database', 'routes', 'workers', 'browser', 'web', 'development', 'e2e']) {
            assert(['true', 'false'].includes(scopes[name]), `${name}: 缺少检查范围`);
            const selected = scopes[name] === 'true' || (name === 'go' && scopes.packaging === 'true');
            assert.equal(needs[name].result, selected ? 'success' : 'skipped', `${name}: 检查结果不符合执行范围`);
          }
          console.log('相关检查全部通过');
          JS
