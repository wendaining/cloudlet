docs:
  - 'docs/**'
  - '**/*.md'
  - 'LICENSE*'
  - 'NOTICE*'
  - '.markdownlint-cli2.jsonc'
  - 'scripts/check-docs.mjs'
  - 'scripts/files.mjs'
  - 'package.json'
  - 'package-lock.json'
  - '.github/workflows/ci.yml'
  - '.github/ci-paths.yml'
  - deleted: '**'

go:
  - 'cmd/**'
  - 'internal/**'
  - 'pkg/**'
  - 'configs/**'
  - 'go.mod'
  - 'go.sum'
  - 'Makefile'
  - '.github/workflows/ci.yml'
  - '.github/ci-paths.yml'
  - '!**/*.md'

tooling:
  - 'compose*.yaml'
  - '.env.example'
  - '.github/**'
  - '.githooks/**'
  - 'scripts/**'
  - 'package.json'
  - 'package-lock.json'
  - 'commitlint.config.js'
  - '.editorconfig'
  - '.gitignore'
  - '!**/*.md'

workflows:
  - '.github/workflows/**'
  - '.github/ci-paths.yml'
  - '.github/actionlint.*'
  - 'go.mod'
  - 'go.sum'
  - '!**/*.md'

container:
  - 'cmd/**'
  - 'internal/**'
  - 'pkg/**'
  - 'go.mod'
  - 'go.sum'
  - 'configs/container.json'
  - 'Dockerfile'
  - '.dockerignore'
  - 'Makefile'
  - 'scripts/smoke-container.sh'
  - '.github/workflows/ci.yml'
  - '.github/workflows/delivery.yml'
  - '.github/ci-paths.yml'
  - '!**/*_test.go'
  - '!**/*.md'

packaging:
  - 'scripts/release.sh'
  - 'Makefile'
  - '.github/workflows/release.yml'
  - '.github/workflows/ci.yml'
  - '.github/ci-paths.yml'

unclassified:
  - '**'
  - '!docs/**'
  - '!**/*.md'
  - '!LICENSE*'
  - '!NOTICE*'
  - '!cmd/**'
  - '!internal/**'
  - '!pkg/**'
  - '!configs/**'
  - '!scripts/**'
  - '!.github/**'
  - '!.githooks/**'
  - '!go.mod'
  - '!go.sum'
  - '!package.json'
  - '!package-lock.json'
  - '!commitlint.config.js'
  - '!Makefile'
  - '!Dockerfile'
  - '!.dockerignore'
  - '!.gitignore'
  - '!.editorconfig'
  - '!.markdownlint-cli2.jsonc'
  - '!compose*.yaml'
  - '!.env.example'
